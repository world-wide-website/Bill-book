<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iframe4</title>
<style>
/* ================= RESET ================= */

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:system-ui,sans-serif;
}

body{
  height:100vh;
  background:#202228;
  color:#d5d8e0;
}

body::before{
  content:"";
  position:fixed;
  inset:-60%;
  z-index:-1;
  opacity:.9;
  transform:rotate(135deg);
  background-repeat:repeat;
  background-size:.75vh .75vh;
  background-image:url("data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAQAAAAECAYAAACp8Z5+AAAAGElEQVQImWNkYGD4z8DAwMDAgAEABiwCBdZk90QAAAAASUVORK5CYII=");
}

/* ================= PAGE ================= */

.page{
  display:flex;
  flex-direction:column;
  align-items: center;
}

/* ================= HEADER ================= */

.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding: 10px 20px;
  background:#000;
  border: 1px solid #a87c29;
  border-radius:10px;
  margin: 10px;
  width: 98%;
}

.title{
  display:flex;
  align-items:center;
  gap:12px;
  color:orange;
  font-size:20px;
}

.selectList{
  display:flex;
  align-items:center;
  gap:10px;
}

.count{
  background:#333;
  padding:5px 10px;
  border-radius:5px;
  color:lawngreen;
}

.tools{
  display:flex;
  gap:10px;
  align-items:center;
}

.tools input{
  width:220px;
}

/* ================= INPUTS ================= */

input, textarea, select{
  width:100%;
  padding:10px;
  background:#1b1d22;
  border:1px solid #333;
  border-radius:6px;
  color:#fff;
  outline:none;
}

input:focus,textarea:focus,select:focus{
  border-color:seagreen;
}

textarea{
  resize:vertical;
  min-height:90px;
}

/* ================= BUTTON ================= */

button{
  border:none;
  cursor:pointer;
  background:seagreen;
  color:#fff;
  padding:10px 16px;
  border-radius:6px;
  transition:.2s;
}

button:hover{
  filter:brightness(1.15);
}

/* ================= PREVIEW ================= */

.previewes{
  display:none;
  gap:15px;
  padding:15px;
  background:#000;
  border:2px solid #333;
  border-radius:12px;
  position: absolute;
  width: 95vw;
  height: 100vh;
  z-index: 2;
  align-items: center;
  justify-content: center;
}

.previewes.show{
  display:flex;
}

.preview{
  width:65%;
  min-height:450px;
  border:none;
  border-radius:10px;
  background:#111;
}

.asider{
  width:35%;
}

/* ================= FORM ================= */

.form{
  width:100%;
}

.fieldset{
  display:flex;
  flex-direction:column;
  gap:10px;
  border:1px solid #333;
  border-radius:10px;
  padding:15px;
}

.legend{
  color:orange;
  font-weight:700;
  padding:0 10px;
}

/* ================= THUMB OPTIONS ================= */

.thumbBox{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:20px;
}

.thumbBox input[type="radio"]{
  width:18px;
  height:18px;
  cursor:pointer;
}

/* ================= SAVE ================= */

.saveBtns{
  display:flex;
  gap:10px;
}

.saveBtns button{
  flex:1;
}

/* ================= PLAYER ================= */

.playerWrap{
  position:sticky;
  top: 0;
  z-index: 1;
}

.main-iframe{
  width:100vw;
  border:none;
  border-radius:12px;
  background:#000;
}

.closeBtn{
  position:absolute;
  top:10px;
  right:10px;
  z-index:10;
  padding: 8px 10px;
  border-radius:5px;
  background:#d33;
}

/* ================= LIST ================= */

.main{
  width:100%;
  padding:15px;
}

.list{
  display:grid;
  gap:15px;
  grid-template-columns:repeat(auto-fill,minmax(420px,1fr));
}

/* ================= CARD ================= */

.card{
  position:relative;
  background:#111;
  border:1px solid #333;
  border-radius:10px;
  overflow:hidden;
  cursor:pointer;
  transition:.25s;
  padding-bottom: 10px;
}

.card:hover{
  transform:translateY(-3px);
  border-color:seagreen;
}

.thumb{
  width:100%;
  /* height:240px; */
  aspect-ratio: 16/9;
  object-fit:cover;
  background:#000;
}

.card h4{
  padding: 5px 10px 0;
  color:#fff;
  font-size:14px;
}

.card small{
  display:block;
  padding: 0px 10px;
  color:#aaa;
}

.fav{
  position:absolute;
  top:10px;
  left:10px;
  width:36px;
  height:36px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:50%;
  background:rgba(0,0,0,.7);
  font-size:18px;
  cursor:pointer;
}

.edit{
  position:absolute;
  top:10px;
  right:10px;
  background:#444;
  font-size:12px;
  padding:6px 12px;
}
/* ================= ARRAY EDITOR ================= */

.array-editor{
    display:none;
    position:fixed;
    inset:0;
    z-index:9999;
    background:rgba(0,0,0,.85);
    align-items:center;
    justify-content:center;
    padding:20px;
}

.array-editor.show{
    display:flex;
}

.array-editor-box{
    width:min(1000px,95vw);
    height:min(750px,90vh);
    display:flex;
    flex-direction:column;
    gap:12px;
    padding:15px;
    background:#111;
    border:2px solid #a87c29;
    border-radius:12px;
    box-shadow:0 0 30px #000;
}

.array-editor-title{
    display:flex;
    align-items:center;
    justify-content:space-between;
    color:orange;
    font-size:18px;
}

.array-editor-textarea{
    flex:1;
    width:100%;
    min-height:300px;
    resize:none;
    padding:15px;
    background:#1b1d22;
    border:1px solid #444;
    border-radius:8px;
    color:#fff;
    font-family:Consolas,monospace;
    font-size:14px;
    line-height:1.6;
    outline:none;
}

.array-editor-textarea:focus{
    border-color:seagreen;
}

.array-editor-buttons{
    display:flex;
    gap:10px;
}

.array-editor-buttons button{
    flex:1;
}

.array-editor-save{
    background:seagreen;
}

.array-editor-cancel{
    background:#a33;
}

@media(max-width:600px){

    .array-editor{
        padding:8px;
    }

    .array-editor-box{
        width:100%;
        height:95vh;
    }

    .array-editor-textarea{
        font-size:12px;
    }

}
/* ================= TABLET ================= */

@media (max-width:1024px){

  .previewes{
    flex-direction:column;
  }

  .preview, .asider{
    width:100%;
  }

  .preview{
    min-height:350px;
  }

  .main-iframe{
    height:60vh;
  }
}

/* ================= MOBILE ================= */

@media (max-width:768px){

  .header{
    /* flex-direction:column; */
    gap:10px;
  }

  .title{
    /* width:100%; */
    justify-content:space-between;
    text-wrap: nowrap;
    font-size: large;
  }

  .count,select , option, .tools{
    font-size: 10px;
    /* height: 25px; */

  }

  .tools input{
    width:100%;
    height: 25px;
  }
  
  .upload{
    width: 30%;
    height: 30px;
    padding: 5px 8px;
  }

  .selectList{
        font-size: 10px;
    /* flex-wrap:wrap; */
  }

  .thumb{
    height:260px;
  }

  .main-iframe{
    height:35vh;
  }
}

/* ================= SMALL MOBILE ================= */

@media (max-width:480px){

  .page{
    padding:10px;
  }

  .saveBtns{
    flex-direction:column;
  }

  .card h4{
    font-size:14px;
  }

  .main-iframe{
    height:40vh;
  }
}
</style>
</head>

document.addEventListener("DOMContentLoaded", () => {


  /* ================= FASTTAG ================= */
  const fastTag=(t,p,c,id,txt)=>{
    const e=document.createElement(t);
    if(c) e.className=c;
    if(id) e.id=id;
    if(txt) e.textContent=txt;
    p&&p.appendChild(e);
    return e;
  };

  const tools=fastTag("div",header,"tools");
  const addBtn=fastTag("button",tools, "upload",null,"Upload");
  const search=fastTag("input",tools);

const dataBtn = fastTag("button", tools, null, null, "Data");
dataBtn.onclick = exportDataStore;

const uploadArrayBtn = fastTag(
    "button",

    null,

);

uploadArrayBtn.onclick = openArrayEditor;

  const preview=fastTag("iframe",previewes,"preview");

  const asider=fastTag("aside",previewes,"asider");
  const form=fastTag("form",asider,"form");

  const fieldset=fastTag("fieldset",form,"fieldset");
  fastTag("legend",fieldset,"legend",null,"Add / Edit");

  const Link=fastTag("textarea",fieldset);
  Link.placeholder="Paste link / iframe";

    o.value=v;
  });

  /* ---------- THUMBNAIL INPUTS ---------- */
  const thumbBox=fastTag("div",fieldset,"thumbBox");

  const rYT=fastTag("input",thumbBox);
  rYT.type="radio"; rYT.name="thumb"; rYT.value="youtube"; rYT.checked=true;

  const rURL=fastTag("input",thumbBox);
  rURL.type="radio"; rURL.name="thumb"; rURL.value="url";

  const rFile=fastTag("input",thumbBox);
  rFile.type="radio"; rFile.name="thumb"; rFile.value="file";

  const thumbURL=fastTag("input",fieldset);
  thumbURL.placeholder="Thumbnail URL";
  thumbURL.style.display="none";

  const thumbFile=fastTag("input",fieldset);
  thumbFile.type="file";
  thumbFile.accept="image/*";
  thumbFile.style.display="none";

  /* ---------- DATE ---------- */
  const dateInput=fastTag("input",fieldset);
  dateInput.type="datetime-local";

  const saveBtns=fastTag("div",fieldset,"saveBtns");

  const deleteBtn=fastTag("button",saveBtns,null,null,"Delete");
  deleteBtn.type="button";

  const saveBtn=fastTag("button",saveBtns,null,null,"Save");
  saveBtn.type="submit";

  /* ---------- MAIN PLAYER ---------- */
  const playerWrap=fastTag("div",page,"playerWrap");
  playerWrap.style.display="none";

  const closeBtn=fastTag("button",playerWrap,"closeBtn",null,"✕");
  const mainIframe=fastTag("iframe",playerWrap,"main-iframe");

  closeBtn.onclick=()=>{
    mainIframe.src="about:blank";
    playerWrap.style.display="none";
};

  /* ---------- LIST + FILTER ---------- */
  const main =fastTag("div",page,"main");

  const countBox=fastTag("span",bar,"count",null,"0");
  const filter=fastTag("select",bar);
  const list = fastTag("div", main,"list");
  ["ALL","FAVORITES","A → Z","Z → A","NEW → OLD","OLD → NEW","URL","YOUTUBE","TIKTOK","INSTAGRAM","OTHER"].forEach(v=>{const o=fastTag("option",filter,null,null,v);o.value=v.toLowerCase();});

  /* ================= STATE ================= */
  let items=JSON.parse(localStorage.getItem("iframes")||"null");
  let lastVideoID = "";

if(!items){
    items=[];
    DataBase.forEach(d=>{
        items.push({
            title:d.title||"",
            url:createURL(d.ids,d.type),
            type:(d.type||"url").toLowerCase(),
            date:new Date().toISOString(),
            thumb:d.type &&
                  d.type.toUpperCase().startsWith("YT") ? ytThumb(d.ids) : "", fav:false, views:0
        });
    });
    localStorage.setItem( "iframes", JSON.stringify(items));
}
  let editIndex=-1;
  let fileThumb="";

  
/* ================= LINK HELPERS ================= */

// YouTube Video & Shorts
const ytId = url => {

    if (!url) return null;

    const match = url.match(
        /(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([A-Za-z0-9_-]{11})/
    );

    return match ? match[1] : null;

};

function exportDataStore(){

    const editor = fastTag(
        "div",
        document.body,
        "array-editor",
        "dataStoreEditor"
    );

    const box = fastTag(
        "div",
        editor,
        "array-editor-box"
    );

    // Title
    const titleBox = fastTag(
        "div",
        box,
        "array-editor-title"
    );

    fastTag(
        "span",
        titleBox,
        null,
        null,
        "Local Storage Data"
    );

    // Textarea
    const textarea = fastTag(
        "textarea",
        box,
        "array-editor-textarea"
    );

    textarea.spellcheck = false;

    // Load current localStorage data
    let localData = JSON.parse(
        localStorage.getItem("iframes") || "[]"
    );

    // Show formatted JSON
    textarea.value = JSON.stringify(
        localData,
        null,
        2
    );

    // Buttons
    const buttons = fastTag(
        "div",
        box,
        "array-editor-buttons"
    );

    const saveBtn = fastTag(
        "button",
        buttons,
        "array-editor-save",
        null,
        "Save Changes"
    );

    const cancelBtn = fastTag(
        "button",
        buttons,
        "array-editor-cancel",
        null,
        "Cancel"
    );

    const copyBtn = fastTag(
        "button",
        buttons,
        null,
        null,
        "Copy"
    );

    // Show editor
    editor.classList.add("show");

    // Cancel
    cancelBtn.onclick = () => {
        editor.remove();
    };

    // Copy
    copyBtn.onclick = async () => {

        try {

            await navigator.clipboard.writeText(
                textarea.value
            );

            alert("Data copied.");

        } catch(error) {

            alert("Unable to copy data.");

        }

    };

    // Save
    saveBtn.onclick = () => {

        try {

            const newData = JSON.parse(
                textarea.value
            );

            if(!Array.isArray(newData)){

                throw new Error(
                    "Data must be an array."
                );

            }

            // Basic validation
            newData.forEach((item, index) => {

                if(typeof item !== "object" || item === null){

                    throw new Error(
                        "Invalid item at index " + index
                    );

                }

            });

            // Save to localStorage
            items = newData;

            localStorage.setItem(
                "iframes",
                JSON.stringify(items)
            );

            // Close editor
            editor.remove();

            // Refresh cards
            render();

            countBox.textContent = items.length;

            alert(
                items.length +
                " items saved successfully."
            );

        } catch(error) {

            alert(
                "Invalid JSON data.\n\n" +
                error.message
            );

        }

    };

}

/* ================= UPLOAD ARRAY EDITOR ================= */

function openArrayEditor(){

    /* ---------- EDITOR ---------- */

    const editor = fastTag(
        "div",
        document.body,
        "array-editor",
        "arrayEditor"
    );

    const box = fastTag(
        "div",
        editor,
        "array-editor-box"
    );

    /* ---------- TITLE ---------- */

    const titleBox = fastTag(
        "div",
        box,
        "array-editor-title"
    );

    fastTag(
        "span",
        titleBox,
        null,
        null,
        "Upload Array"
    );

    /* ---------- TEXTAREA ---------- */

    const textarea = fastTag(
        "textarea",
        box,
        "array-editor-textarea"
    );

    textarea.spellcheck = false;

    /* ---------- GET LOCAL STORAGE ---------- */

    let localData = JSON.parse(
        localStorage.getItem("iframes") || "[]"
    );

    /* ---------- CONVERT LOCAL DATA ---------- */

    const lines = [];

    localData.forEach(item => {

        const id = ytId(item.url) || "";

        const time = item.duration || "00:00";

        const title = item.title || "";

        lines.push(
            `{ ids: ${JSON.stringify(id)}, time: ${JSON.stringify(time)}, title: ${JSON.stringify(title)}},`
        );

    });

    textarea.value = lines.join("\n");

    /* ---------- BUTTONS ---------- */

    const buttons = fastTag(
        "div",
        box,
        "array-editor-buttons"
    );

    const saveArrayBtn = fastTag(
        "button",
        buttons,
        "array-editor-save",
        null,
        "Save Array"
    );

    const cancelArrayBtn = fastTag(
        "button",
        buttons,
        "array-editor-cancel",
        null,
        "Cancel"
    );

    /* ---------- SHOW ---------- */

    editor.classList.add("show");

    /* ---------- CANCEL ---------- */

    cancelArrayBtn.onclick = () => {
        editor.remove();
    };

    /* ---------- SAVE ---------- */

    saveArrayBtn.onclick = () => {

        const text = textarea.value.trim();

        if(!text){

            if(!confirm("Array is empty. Clear local data?"))
                return;

            items = [];

            localStorage.setItem(
                "iframes",
                JSON.stringify(items)
            );

            editor.remove();

            render();

            return;
        }

        try{

            /* --------------------------------
               CONVERT OBJECT LINES TO ARRAY
            -------------------------------- */

            const cleaned = text
                .replace(/const\s+\w+\s*=\s*\[/i, "")
                .replace(/^\s*\[/, "")
                .replace(/\]\s*;?\s*$/, "")
                .trim();

            if(!cleaned){
                throw new Error("No array data found.");
            }

            const objectText = "[" + cleaned + "]";

            /*
             * Parse JavaScript-style objects.
             * This supports:
             *
             * { ids:"abc", time:"00:00", title:"Hello" }
             *
             * and emoji/unicode titles.
             */

            const parsed = Function(
                `"use strict"; return (${objectText});`
            )();

            if(!Array.isArray(parsed)){
                throw new Error("Array format is invalid.");
            }

            /* --------------------------------
               CREATE LOCAL STORAGE DATA
            -------------------------------- */

            const newItems = [];

            parsed.forEach((data, index) => {

                const ids = String(data.ids || "").trim();

                const time =
                    String(data.time || "00:00").trim();

                const title =
                    String(data.title || "").trim();

                if(!ids){
                    return;
                }

                const url =
                    `https://www.youtube.com/watch?v=${ids}`;

                newItems.push({

                    title: title || "Untitled",

                    url: url,

                    type: "youtube",

                    date: new Date().toISOString(),

                    thumb: ytThumb(ids),

                    fav: false,

                    views: 0,

                    duration: time

                });

            });

            /* --------------------------------
               UPDATE LOCAL STORAGE
            -------------------------------- */

            items = newItems;

            localStorage.setItem(
                "iframes",
                JSON.stringify(items)
            );

            /* --------------------------------
               CLOSE + R
