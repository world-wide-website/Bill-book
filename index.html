<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iframe</title>
<style>
/* ================= RESET ================= */

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:system-ui,sans-serif;
}

body{
  height:100vh;
  background:#202228;
  color:#d5d8e0;
}

body::before{
  content:"";
  position:fixed;
  inset:-60%;
  z-index:-1;
  opacity:.9;
  transform:rotate(135deg);
  background-repeat:repeat;
  background-size:.75vh .75vh;
  background-image:url("data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAQAAAAECAYAAACp8Z5+AAAAGElEQVQImWNkYGD4z8DAwMDAgAEABiwCBdZk90QAAAAASUVORK5CYII=");
}

/* ================= PAGE ================= */

.page{
  display:flex;
  flex-direction:column;
  align-items: center;
}

/* ================= HEADER ================= */

.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:12px 15px;
  background:#000;
  border:2px solid #a87c29;
  border-radius:10px;
  margin: 10px;
  width: 98%;
}

.title{
  display:flex;
  align-items:center;
  gap:12px;
  color:orange;
  font-size:20px;
}

.selectList{
  display:flex;
  align-items:center;
  gap:10px;
}

.count{
  background:#333;
  padding:5px 10px;
  border-radius:5px;
  color:lawngreen;
}

.tools{
  display:flex;
  gap:10px;
  align-items:center;
}

.tools input{
  width:220px;
}

/* ================= INPUTS ================= */

input,
textarea,
select{
  width:100%;
  padding:10px;
  background:#1b1d22;
  border:1px solid #333;
  border-radius:6px;
  color:#fff;
  outline:none;
}

input:focus,
textarea:focus,
select:focus{
  border-color:seagreen;
}

textarea{
  resize:vertical;
  min-height:90px;
}

/* ================= BUTTON ================= */

button{
  border:none;
  cursor:pointer;
  background:seagreen;
  color:#fff;
  padding:10px 16px;
  border-radius:6px;
  transition:.2s;
}

button:hover{
  filter:brightness(1.15);
}

/* ================= PREVIEW ================= */

.previewes{
  display:none;
  gap:15px;
  padding:15px;
  background:#000;
  border:2px solid #333;
  border-radius:12px;
  position: absolute;
  width: 95vw;
  height: 100vh;
  z-index: 2;
  align-items: center;
  justify-content: center;
}

.previewes.show{
  display:flex;
}

.preview{
  width:65%;
  min-height:450px;
  border:none;
  border-radius:10px;
  background:#111;
}

.asider{
  width:35%;
}

/* ================= FORM ================= */

.form{
  width:100%;
}

.fieldset{
  display:flex;
  flex-direction:column;
  gap:10px;
  border:1px solid #333;
  border-radius:10px;
  padding:15px;
}

.legend{
  color:orange;
  font-weight:700;
  padding:0 10px;
}

/* ================= THUMB OPTIONS ================= */

.thumbBox{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:20px;
}

.thumbBox input[type="radio"]{
  width:18px;
  height:18px;
  cursor:pointer;
}

/* ================= SAVE ================= */

.saveBtns{
  display:flex;
  gap:10px;
}

.saveBtns button{
  flex:1;
}

/* ================= PLAYER ================= */

.playerWrap{
  position:sticky;
  top: 0;
  z-index: 1;
}

.main-iframe{
  width:100vw;
  aspect-ratio: 16/9;
  border:none;
  border-radius:12px;
  background:#000;
}

.closeBtn{
  position:absolute;
  top:10px;
  right:10px;
  z-index:10;
  padding: 8px 10px;
  border-radius:5px;
  background:#d33;
}

/* ================= LIST ================= */

.main{
  width:100%;
  padding:15px;
}

.list{
  display:grid;
  gap:15px;
  grid-template-columns:repeat(auto-fill,minmax(420px,1fr));
}

/* ================= CARD ================= */

.card{
  position:relative;
  background:#111;
  border:1px solid #333;
  border-radius:10px;
  overflow:hidden;
  cursor:pointer;
  transition:.25s;
}

.card:hover{
  transform:translateY(-3px);
  border-color:seagreen;
}

.thumb{
  width:100%;
  /* height:240px; */
  aspect-ratio: 16/9;
  object-fit:cover;
  background:#000;
}

.card h4{
  padding:10px 10px 0;
  color:#fff;
  font-size:15px;
}

.card small{
  display:block;
  padding:5px 10px 10px;
  color:#aaa;
}

.fav{
  position:absolute;
  top:10px;
  left:10px;
  width:36px;
  height:36px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:50%;
  background:rgba(0,0,0,.7);
  font-size:18px;
  cursor:pointer;
}

.edit{
  position:absolute;
  top:10px;
  right:10px;
  background:#444;
  font-size:12px;
  padding:6px 12px;
}

/* ================= TABLET ================= */

@media (max-width:1024px){

  .previewes{
    flex-direction:column;
  }

  .preview, .asider{
    width:100%;
  }

  .preview{
    min-height:350px;
  }

  .main-iframe{
    height:60vh;
  }
}

/* ================= MOBILE ================= */

@media (max-width:768px){

  .header{
    /* flex-direction:column; */
    gap:10px;
  }

  .title{
    /* width:100%; */
    justify-content:space-between;
    text-wrap: nowrap;
    font-size: large;
  }

  .count,select , option, .tools{
    font-size: 10px;
    /* height: 25px; */

  }
  .tools{
    /* width:100%; */
    /* flex-direction:column; */
  }

  .tools input{
    width:100%;
    height: 25px;
  }
  
  .upload{
    width: 30%;
    height: 30px;
    padding: 5px 8px;
  }

  .selectList{
        font-size: 10px;
    /* flex-wrap:wrap; */
  }

  .thumb{
    height:260px;
  }

  .main-iframe{
    height:35vh;
  }
}

/* ================= SMALL MOBILE ================= */

@media (max-width:480px){

  .page{
    padding:10px;
  }

  .saveBtns{
    flex-direction:column;
  }

  .thumb{
  }

  .card h4{
    font-size:14px;
  }

  .main-iframe{
    height:40vh;
  }
}
</style>
</head>
<body></body>
<script>
document.addEventListener("DOMContentLoaded", () => {

const DataBase = [
  { ids:"r2WSzUc4mK0", time:"09:48", title:"Arijit Singh Mashup 2025", type:"YT" },
  { ids:"J4KIe4Cf1eQ", time:"00:48", title:"Arijit Singh Mashup 2026", type:"YT-Short" },
  { ids:"KUN5Uf9mObQ", time:"04:41", title:"Arabic Kuthu - Video Song | Beast", type:"YT-Short" },
  { ids:"kPcE5GLLQAg", time:"04:49", title:"Kannulato Choosedi | Jeans Telugu Song", type:"YT"  },
  { ids:"zK1BQk0L-5U", time:"05:10", title:"Chitti Nadumume" },
  { ids:"qaU03QRrcPs", time:"04:05", title:"Telusa Telusa" }, 
];

  /* ================= FASTTAG ================= */
  const fastTag=(t,p,c,id,txt)=>{
    const e=document.createElement(t);
    if(c) e.className=c;
    if(id) e.id=id;
    if(txt) e.textContent=txt;
    p&&p.appendChild(e);
    return e;
  };

  /* ================= LAYOUT ================= */
  const page=fastTag("div",document.body,"page");

  /* ---------- HEADER ---------- */
  const header=fastTag("header",page,"header");
  const title = fastTag("h2",header,"title",null,"Iframe Store :");
        const bar=fastTag("div",title,"selectList");
  const tools=fastTag("div",header,"tools");
  const addBtn=fastTag("button",tools, "upload",null,"Upload");
  const search=fastTag("input",tools);
        search.placeholder="Search…";

  /* ---------- PREVIEW + FORM ---------- */
  const previewes=fastTag("div",page,"previewes");
  const preview=fastTag("iframe",previewes,"preview");

  const asider=fastTag("aside",previewes,"asider");
  const form=fastTag("form",asider,"form");

  const fieldset=fastTag("fieldset",form,"fieldset");
  fastTag("legend",fieldset,"legend",null,"Add / Edit");

  const Link=fastTag("textarea",fieldset);
  Link.placeholder="Paste link / iframe";

  const Title=fastTag("input",fieldset);
  Title.placeholder="Title";

  const Formate=fastTag("select",fieldset);
  ["url","youtube","tiktok","instagram","other"].forEach(v=>{
    const o=fastTag("option",Formate,null,null,v.toUpperCase());
    o.value=v;
  });

  /* ---------- THUMBNAIL INPUTS ---------- */
  const thumbBox=fastTag("div",fieldset,"thumbBox");

  const rYT=fastTag("input",thumbBox);
  rYT.type="radio"; rYT.name="thumb"; rYT.value="youtube"; rYT.checked=true;

  const rURL=fastTag("input",thumbBox);
  rURL.type="radio"; rURL.name="thumb"; rURL.value="url";

  const rFile=fastTag("input",thumbBox);
  rFile.type="radio"; rFile.name="thumb"; rFile.value="file";

  const thumbURL=fastTag("input",fieldset);
  thumbURL.placeholder="Thumbnail URL";
  thumbURL.style.display="none";

  const thumbFile=fastTag("input",fieldset);
  thumbFile.type="file";
  thumbFile.accept="image/*";
  thumbFile.style.display="none";

  /* ---------- DATE ---------- */
  const dateInput=fastTag("input",fieldset);
  dateInput.type="datetime-local";

  const saveBtns=fastTag("div",fieldset,"saveBtns");

  const deleteBtn=fastTag("button",saveBtns,null,null,"Delete");
  deleteBtn.type="button";

  const saveBtn=fastTag("button",saveBtns,null,null,"Save");
  saveBtn.type="submit";

  /* ---------- MAIN PLAYER ---------- */
  const playerWrap=fastTag("div",page,"playerWrap");
  playerWrap.style.display="none";

  const closeBtn=fastTag("button",playerWrap,"closeBtn",null,"✕");
  const mainIframe=fastTag("iframe",playerWrap,"main-iframe");

  closeBtn.onclick=()=>{
    mainIframe.src="";
    playerWrap.style.display="none";
  };

  /* ---------- LIST + FILTER ---------- */
  const main =fastTag("div",page,"main");

  const countBox=fastTag("span",bar,"count",null,"0");
  const filter=fastTag("select",bar);
  ["ALL","FAVORITES","URL","YOUTUBE","TIKTOK","INSTAGRAM","OTHER","A → Z","Z → A","NEW → OLD","OLD → NEW"].forEach(
    v=>{const o=fastTag("option",filter,null,null,v);o.value=v.toLowerCase();});
  

    const list = fastTag("div", main,"list");

  /* ================= STATE ================= */
  let items=JSON.parse(localStorage.getItem("iframes")||"[]");
  let editIndex=-1;
  let fileThumb="";

  // ✅ FIXED YOUTUBE ID (supports iframe + embed)
  const ytId = v => {
    const m = v.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/))([a-zA-Z0-9_-]{11})/);
    return m ? m[1] : null;
  };

  const tkId=v=>v.match(/video\/(\d+)/)?.[1];
  const igId=v=>v.match(/\/reel\/([^\/]+)/)?.[1];

  function detectFormat(v){
    if(v.includes("<iframe")) return "other";
    if(/youtube\.com|youtu\.be/.test(v)) return "youtube";
    if(/tiktok\.com/.test(v)) return "tiktok";
    if(/instagram\.com\/reel/.test(v)) return "instagram";
    return "url";
  }

  function buildEmbed(v){
    if(ytId(v)) return `https://www.youtube-nocookie.com/embed/${ytId(v)}?autoplay=1`;
    if(tkId(v)) return `https://www.tiktok.com/embed/v2/${tkId(v)}`;
    if(igId(v)) return `https://www.instagram.com/reel/${igId(v)}`;
    if(v.includes("<iframe")){
      const m=v.match(/src="([^"]+)"/);
      return m?m[1]:"";
    }
    return v;
  }

  const ytThumb=id=>`https://img.youtube.com/vi/${id}/maxresdefault.jpg`;

  /* ================= THUMB UI ================= */
  function updateThumbUI(){

    thumbURL.style.display = "none";
    thumbFile.style.display = "none";

    if(rYT.checked){

        thumbURL.style.display = "block";

        const id = ytId(Link.value);

        if(id)
            thumbURL.value = ytThumb(id);

    }

    if(rURL.checked){

        thumbURL.style.display = "block";

    }

    if(rFile.checked){

        thumbFile.style.display = "block";

    }

}

  /* ================= EVENTS ================= */
  addBtn.onclick=()=>{
    previewes.classList.toggle("show");
    editIndex=-1;
    form.reset();
    preview.src="";
    fileThumb="";
    rYT.checked=true;
    updateThumbUI();
  };

  Link.oninput=()=>{
    if(!Link.value) return preview.src="";
    const t=detectFormat(Link.value);
    Formate.value=t;
    preview.src=buildEmbed(Link.value);
    updateThumbUI();
  };

  rYT.onchange=rURL.onchange=rFile.onchange=updateThumbUI;

  thumbFile.onchange=()=>{
    const f=thumbFile.files[0];
    if(!f) return;
    const r=new FileReader();
    r.onload=()=>fileThumb=r.result;
    r.readAsDataURL(f);
  };

  /* ================= SAVE ================= */
  form.onsubmit=e=>{
    e.preventDefault();
    if(!Link.value) return;

    const type=detectFormat(Link.value);
    let thumb="";

    if(rFile.checked && fileThumb) thumb=fileThumb;
    else if(rURL.checked && thumbURL.value) thumb=thumbURL.value;
    else if(type==="youtube") thumb=ytThumb(ytId(Link.value));

    const obj={
      title:Title.value||"Untitled",
      url:Link.value,
      type,
      date:dateInput.value||new Date().toISOString(),
      thumb,
      fav:false,
      views:0
    };

    if(editIndex>-1) items[editIndex]={...items[editIndex],...obj};
    else items.push(obj);

    localStorage.setItem("iframes",JSON.stringify(items));
    previewes.classList.remove("show");
    render();
  };

  deleteBtn.onclick=()=>{
    if(editIndex<0) return;
    items.splice(editIndex,1);
    localStorage.setItem("iframes",JSON.stringify(items));
    previewes.classList.remove("show");
    render();
  };

  search.oninput=render;
  filter.onchange=render;

  /* ================= LOAD / EDIT ================= */
  function loadMain(o,i){
    o.views++;
    mainIframe.src=buildEmbed(o.url);
    playerWrap.style.display="block";
    items[i]=o;
    localStorage.setItem("iframes",JSON.stringify(items));
    render();
  }

  function editItem(o,i){
    previewes.classList.add("show");
    editIndex=i;

    Title.value=o.title;
    Link.value=o.url;
    Formate.value=o.type;
    dateInput.value=o.date.slice(0,16);
    preview.src=buildEmbed(o.url);

    thumbURL.value=o.thumb||"";
    fileThumb="";

    if(o.thumb?.startsWith("data:")){
      rFile.checked=true;
    }else if(o.type==="youtube"){
      rYT.checked=true;
      thumbURL.value=ytThumb(ytId(o.url));
    }else{
      rURL.checked=true;
    }

    updateThumbUI();
  }

  /* ================= RENDER ================= */
  function render(){
    list.innerHTML="";
    let shown=0;
    const q=search.value.toLowerCase();
    const f=filter.value;

    let data=[...items];

    if(f==="a → z") data.sort((a,b)=>a.title.localeCompare(b.title));
    if(f==="z → a") data.sort((a,b)=>b.title.localeCompare(a.title));
    if(f==="new → old") data.sort((a,b)=>new Date(b.date)-new Date(a.date));
    if(f==="old → new") data.sort((a,b)=>new Date(a.date)-new Date(b.date));

    data.forEach((o,i)=>{
      if(q && !o.title.toLowerCase().includes(q)) return;
      if(f==="favorites" && !o.fav) return;
      if(!["all","favorites","a → z","z → a","new → old","old → new"].includes(f) && o.type!==f) return;

      shown++;
      const card=fastTag("div",list,"card");

      const img=fastTag("img",card,"thumb");
      img.src=o.thumb||"";

      fastTag("h4",card,null,null,o.title+" ("+o.type.toUpperCase()+")");
      fastTag("small",card,null,null,`Views: ${o.views} • ${new Date(o.date).toLocaleString()}`);

      const fav=fastTag("div",card,"fav",null,o.fav?"❤️":"♡");
      fav.onclick=e=>{
        e.stopPropagation();
        o.fav=!o.fav;
        items[i]=o;
        localStorage.setItem("iframes",JSON.stringify(items));
        render();
      };

      const edit=fastTag("button",card,"edit",null,"Edit");
      edit.onclick=e=>{
        e.stopPropagation();
        editItem(o,i);
      };

      card.onclick=()=>loadMain(o,i);
    });

    countBox.textContent=shown;
  }

  render();
});
</script>
</html>
