<html lang="en">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Player</title>
<style>
/* ================= RESET ================= */

*{
  font-family:system-ui,sans-serif;
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  height:100vh;
  width: 100%;
  background:#202228;
  color:#d5d8e0;
  /* display: flex; */
  /* align-items: center; */
  /* justify-content: center; */
}

body::before{
  content:"";
  position:fixed;
  inset:-60%;
  z-index:-1;
  opacity:.9;
  transform:rotate(135deg);
  background-repeat:repeat;
  background-size:.75vh .75vh;
  background-image:url("data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAQAAAAECAYAAACp8Z5+AAAAGElEQVQImWNkYGD4z8DAwMDAgAEABiwCBdZk90QAAAAASUVORK5CYII=");
}

/* ================= PAGE ================= */

.page{
  display:flex;
  flex-direction:column;
  align-items: center;
  justify-content: center;
  width: 100%;
}

/* ================= HEADER ================= */

.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding: 10px 20px;
  background:#000;
  border: 1px solid #a87c29;
  border-radius:10px;
  margin: 10px;
  gap: 10px;
  width: 98%;
  position:sticky;
  top: 0;
  z-index: 1;
}

.title{
  display:flex;
  align-items:center;
  gap:12px;
  color:orange;
  font-size:20px;
}

.selectList{
  display:flex;
  align-items:center;
  justify-content: center;
  gap:10px;
}

.count{
  background:#333;
  padding:5px 10px;
  border-radius:5px;
  color:lawngreen;
}

.tools{
  display:flex;
  gap:10px;
  align-items:center;
}

.tools input{
  width:220px;
}

/* ================= INPUTS ================= */

input, textarea, select{
  width:100%;
  padding:10px;
  background:#1b1d22;
  border:1px solid #333;
  border-radius:6px;
  color:#fff;
  outline:none;
}

input:focus,textarea:focus,select:focus{
  border-color:seagreen;
}

textarea{
  resize:vertical;
  min-height:90px;
}

/* ================= BUTTON ================= */

button{
  border:none;
  cursor:pointer;
  background:seagreen;
  color:#fff;
  padding:10px 16px;
  border-radius:6px;
  transition:.2s;
}

button:hover{
  filter:brightness(1.15);
}

/* ================= PREVIEW ================= */

.previewes{
    display: none;
    gap: 15px;
    padding: 15px;
    background: #000;
    border: 2px solid #333;
    border-radius: 12px;
    position: fixed;
    width: 95vw;
    height: 85vh;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 2;
    align-items: center;
    justify-content: center;
}

.previewes.show{
  display:flex;
}

.preview{
  width:65%;
  min-height:450px;
  border:none;
  border-radius:10px;
  background:#111;
}

.asider{
  width:35%;
}

/* ================= FORM ================= */

.form{
  width:100%;
}

.fieldset{
  display:flex;
  flex-direction:column;
  gap:10px;
  border:1px solid #333;
  border-radius:10px;
  padding:15px;
}

.legend{
  color:orange;
  font-weight:700;
  padding:0 10px;
}

/* ================= THUMB OPTIONS ================= */

.thumbBox{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:20px;
}

.thumbBox input[type="radio"]{
  width:18px;
  height:18px;
  cursor:pointer;
}

/* ================= SAVE ================= */

.saveBtns{
  display:flex;
  gap:10px;
}

.saveBtns button{
  flex:1;
}

/* ================= PLAYER ================= */

.playerWrap{
  width: 98vw;
  border-radius: 0;
  position:sticky;
  top: 0;
  z-index: 1;
}

.main-iframe{
  min-height: 500px;
  width:100%;
  border:none;
  border-radius:12px;
  background:#000;
}

.closeBtn{
  position:absolute;
  top:10px;
  right:8px;
  z-index:10;
  padding: 8px 10px;
  border-radius:5px;
  background:#d33;
}

/* ================= LIST ================= */

.main{
  width:100%;
  padding: 5px 10px;
}

.list{
  display:grid;
  /* width: 100%; */
  gap:10px;
  /* border: #d33 solid ; */
  grid-template-columns:repeat(auto-fill,minmax(420px,1fr));
}

/* ================= CARD ================= */

.card{
  position:relative;
  background:#111;
  border:1px solid #333;
  border-radius:10px;
  overflow:hidden;
  cursor:pointer;
  transition:.25s;
  padding-bottom: 10px;
}

.card:hover{
  transform:translateY(-3px);
  border-color:seagreen;
}

.thumb{
  width:100%;
  /* height: 100%; */
  min-height:240px;
  aspect-ratio: 16/9;
  object-fit:cover;
  background:#000;
}

.card h4{
  padding: 5px 10px 0;
  color:#fff;
  font-size:14px;
}

.card small{
  display:block;
  padding: 0px 10px;
  color:#aaa;
}

.fav{
  position:absolute;
  top:10px;
  left:10px;
  width:36px;
  height:36px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:50%;
  background:rgba(0,0,0,.7);
  font-size:18px;
  cursor:pointer;
}

.edit{
  position:absolute;
  top:10px;
  right:10px;
  background:#444;
  font-size:12px;
  padding:6px 12px;
}
/* ================= ARRAY EDITOR ================= */

.array-editor{
    display:none;
    position:fixed;
    inset:0;
    z-index:9;
    background:rgba(0,0,0,.85);
    align-items:center;
    justify-content:center;
    padding:20px;
}

.array-editor.show{
    display:flex;
}

.array-editor-box{
    width:min(90%,95vw);
    height:min(80%,90vh);
    display:flex;
    flex-direction:column;
    gap:12px;
    padding:15px;
    background:#111;
    border:2px solid #a87c29;
    border-radius:12px;
    box-shadow:0 0 30px #000;
}

.array-editor-title{
    display:flex;
    align-items:center;
    justify-content:space-between;
    color:orange;
    font-size:18px;
}

.array-editor-textarea{
    flex:1;
    width:100%;
    min-height:300px;
    resize:none;
    padding:15px;
    background:#1b1d22;
    border:1px solid #444;
    border-radius:8px;
    color:#fff;
    font-family:Consolas,monospace;
    font-size:14px;
    line-height:1.6;
    outline:none;
}

.array-editor-textarea:focus{
    border-color:seagreen;
}

.array-editor-buttons{
    display:flex;
    gap:10px;
}

.array-editor-buttons button{
    flex:1;
}

.array-editor-save{
    background:seagreen;
}

.DataBtn{
    background:rgb(58, 110, 208);
}

.array-editor-cancel, .deleteBtn{
    background:#a33;
}

@media(max-width:600px){

    .array-editor{
        padding:8px;
    }

    .array-editor-box{
        width:100%;
        height:95vh;
    }

    .array-editor-textarea{
        font-size:12px;
    }

}
/* ================= TABLET ================= */

@media (max-width:1024px){

  .previewes{
    flex-direction:column;
  }

  .preview, .asider{
    width:100%;
  }

  .preview{
    min-height:350px;
  }

  .main-iframe{
    height:60vh;
  }
}

/* ================= MOBILE ================= */

@media (max-width:768px){

  .header{
    /* flex-direction:column; */
    gap:10px;
  }

  .title{
    /* width:100%; */
    justify-content:space-between;
    text-wrap: nowrap;
    font-size: large;
  }

  .count,select , option, .tools{
    font-size: 10px;
    /* height: 25px; */

  }

  select{
    padding: 4px 10px;
  }

  .tools input{
    width:100%;
    height: 25px;
  }
  
  .upload{
    width: 30%;
    height: 25px;
    padding: 5px 10px;
  }

  .selectList{
        font-size: 10px;
    /* flex-wrap:wrap; */
  }

  .thumb{
    height:260px;
  }

  .main-iframe{
    height:35vh;
  }
}

/* ================= SMALL MOBILE ================= */

@media (max-width:480px){

  .page{
    padding:10px;
  }

  .saveBtns{
    flex-direction:column;
  }

  .card h4{
    font-size:14px;
  }

  .main-iframe{
    height:40vh;
  }
}
</style>

    /* =====================================================
       STORAGE CONFIG
    ===================================================== */

    const STORAGE_KEY = "LocalStore";
    const OLD_STORAGE_KEY = "iframes";


    /* =====================================================
       YOUTUBE HELPERS
    ===================================================== */

    const ytId = url => {

        if (!url) return null;

        const match = String(url).match(
            /(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([A-Za-z0-9_-]{11})/
        );

        return match ? match[1] : null;
    };


    const getYouTubeThumbnail = url => {

        const id = ytId(url);

        if (!id) return "";

        return `https://i.ytimg.com/vi/${id}/hqdefault.jpg`;
    };


    const getYouTubeThumbnailFromId = id => {

        if (!id) return "";

        return `https://i.ytimg.com/vi/${id}/hqdefault.jpg`;
    };


    /* =====================================================
       URL CREATOR
    ===================================================== */

    function createURL(ids, type) {

        type = String(type || "").toUpperCase();

        switch (type) {

            case "YT":
            case "YOUTUBE":
                return `https://www.youtube.com/watch?v=${ids}`;

            case "YT-SHORT":
            case "YT-SHORTS":
                return `https://www.youtube.com/shorts/${ids}`;

            case "TIKTOK":
                return `https://www.tiktok.com/@user/video/${ids}`;

            case "INSTAGRAM":
                return `https://www.instagram.com/reel/${ids}/`;

            case "FACEBOOK":
                return `https://www.facebook.com/reel/${ids}`;

            case "TWITTER":
            case "X":
                return `https://x.com/i/status/${ids}`;

            case "TELEGRAM":
                return `https://t.me/${ids}`;

            case "WHATSAPP":
                return `https://wa.me/${ids}`;

            default:
                return ids || "";
        }
    }


    /* =====================================================
       NORMALIZE ITEM
    ===================================================== */

    function normalizeItem(item) {

        if (!item || typeof item !== "object") {
            return null;
        }

        const url = String(item.url || "").trim();

        let type = String(
            item.type || detectFormat(url)
        ).toLowerCase();

        if (!type) {
            type = "url";
        }

        let thumb = String(item.thumb || "");

        if (!thumb && (type === "youtube" || type === "yt-short")) {
            thumb = getYouTubeThumbnail(url);
        }

        return {

            title: String(
                item.title || "Untitled"
            ),

            url: url,

            type: type,

            date: item.date
                ? String(item.date)
                : new Date().toISOString(),

            thumb: thumb,

            fav: Boolean(item.fav),

            views: Number.isFinite(Number(item.views))

    /* =====================================================
       LOAD LOCAL STORE
    ===================================================== */

    function loadStore() {

        /*
            1. First load LocalStore.
            2. If unavailable, migrate old "iframes".
            3. If neither exists, use default LocalStore.
        */

        try {

            const saved = localStorage.getItem(STORAGE_KEY);

            if (saved !== null) {

                const parsed = JSON.parse(saved);

                if (Array.isArray(parsed)) {

                    return parsed
                        .map(normalizeItem)
                        .filter(Boolean);
                }
            }

        } catch (error) {

            console.error(
                "LocalStore read error:",
                error
            );
        }


        /* =================================================
           OLD STORAGE MIGRATION
        ================================================= */

        try {

            const oldSaved =
                localStorage.getItem(OLD_STORAGE_KEY);

            if (oldSaved !== null) {

                const oldData = JSON.parse(oldSaved);

                if (Array.isArray(oldData)) {

                    const migrated = oldData
                        .map(normalizeItem)
                        .filter(Boolean);

                    localStorage.setItem(
                        STORAGE_KEY,
                        JSON.stringify(migrated)
                    );

                    return migrated;
                }
            }

        } catch (error) {

            console.error(
                "Old storage migration error:",
                error
            );
        }


        /* =================================================
           DEFAULT DATA
        ================================================= */

        const defaults = LocalStore
            .map(normalizeItem)
            .filter(Boolean);

        try {

            localStorage.setItem(
                STORAGE_KEY,
                JSON.stringify(defaults)
            );

        } catch (error) {

            console.error(
                "Default LocalStore save error:",
                error
            );
        }

        return defaults;
    }


    /* =====================================================
       SAVE LOCAL STORE
    ===================================================== */

    function saveStore() {

        try {

            const cleanData = items
                .map(normalizeItem)
                .filter(Boolean);

            items = cleanData;

            localStorage.setItem(
                STORAGE_KEY,
                JSON.stringify(items)
            );

            /*
                Keep old key synchronized only if it already
                existed. This prevents old applications from
                unexpectedly losing their data.
            */

            if (localStorage.getItem(OLD_STORAGE_KEY) !== null) {

                localStorage.setItem(
                    OLD_STORAGE_KEY,
                    JSON.stringify(items)
                );
            }

            return true;

        } catch (error) {

            console.error(
                "LocalStore save error:",
                error
            );

            alert(
                "Unable to save data.\n\n" +
                error.message
            );

            return false;
        }
    }

    /* =====================================================
       FORMAT DETECTION
    ===================================================== */

    function detectFormat(url) {

        if (!url) {
            return "url";
        }

        const value = String(url).toLowerCase();

        if (value.includes("<iframe")) {
            return "iframe";
        }

        if (value.includes("/shorts/")) {
            return "yt-short";
        }

        if (
            value.includes("youtube.com") ||
            value.includes("youtu.be")
        ) {
            return "youtube";
        }

        if (value.includes("tiktok.com")) {
            return "tiktok";
        }

        if (value.includes("instagram.com")) {
            return "instagram";
        }

        if (value.includes("facebook.com")) {
            return "facebook";
        }

        if (
            value.includes("twitter.com") ||
            value.includes("x.com")
        ) {
            return "twitter";
        }

        if (value.includes("t.me")) {
            return "telegram";
        }

        if (
            value.includes("wa.me") ||
            value.includes("whatsapp")
        ) {
            return "whatsapp";
        }

        return "url";
    }


    /* =====================================================
       OTHER IDs
    ===================================================== */

    const tkId = url => {

        if (!url) return null;

        const match =
            String(url).match(/video\/(\d+)/);

        return match ? match[1] : null;
    };


    const igId = url => {

        if (!url) return null;

        const match =
            String(url).match(/reel\/([^/?]+)/);

        return match ? match[1] : null;
    };


    const fbId = url => {

        if (!url) return null;

        const match =
            String(url).match(/[?&]v=([0-9]+)/);

        return match ? match[1] : null;
    };


    const xId = url => {

        if (!url) return null;

        const match =
            String(url).match(/status\/([0-9]+)/);

        return match ? match[1] : null;
    };


    /* =====================================================
       EMBED BUILDER
    ===================================================== */

    function buildEmbed(url) {

        if (!url) {
            return "";
        }

        url = String(url).trim();


        /* YouTube */

        const yid = ytId(url);

        if (yid) {

            return (
                `https://www.youtube-nocookie.com/embed/${yid}?autoplay=1`
            );
        }


        /* TikTok */

        const tid = tkId(url);

        if (tid) {

            return (
                `https://www.tiktok.com/embed/v2/${tid}`
            );
        }


        /* Instagram */

        const iid = igId(url);

        if (iid) {

            return (
                `https://www.instagram.com/reel/${iid}/embed`
            );
        }


        /* iframe HTML */

        if (
            url.toLowerCase().includes("<iframe")
        ) {

            const src =
                url.match(/src=["']([^"']+)["']/i);

            return src ? src[1] : "";
        }


        return url;
    }


    /* =====================================================
       YOUTUBE TITLE
    ===================================================== */

    async function fetchYouTubeTitle(url) {

        const id = ytId(url);

        if (!id) {
            return "";
        }

        try {

            const response = await fetch(
                `https://www.youtube.com/oembed?url=https://www.youtube.com/watch?v=${id}&format=json`
            );

            if (!response.ok) {
                return "";
            }

            const data = await response.json();

            return data.title || "";

        } catch (error) {

            console.warn(
                "YouTube title fetch failed:",
                error
            );

            return "";
        }
    }

                textarea.select();

        /* =================================================
           SAVE EDITOR
        ================================================= */

        saveEditorBtn.onclick = () => {

            try {

                const newData =
                    JSON.parse(
                        textarea.value
                    );


                if (!Array.isArray(newData)) {

                    throw new Error(
                        "Data must be an array."
                    );
                }


                const normalized =
                    newData.map(
                        (item, index) => {

                            if (
                                typeof item !== "object" ||
                                item === null ||
                                Array.isArray(item)
                            ) {

                                throw new Error(
                                    `Invalid item at index ${index}.`
                                );
                            }


                            const result =
                                normalizeItem(item);


                            if (!result.url) {

                                throw new Error(
                                    `Missing URL at index ${index}.`
                                );
                            }


                            return result;
                        }
                    );


                items = normalized;


                if (!saveStore()) {
                    return;
                }


                editIndex = -1;

                render();


                editor.remove();


                alert(
                    `${items.length} items saved successfully to LocalStore.`
                );


            } catch (error) {

                alert(
                    "Invalid JSON data.\n\n" +
                    error.message
                );
            }
        };

        ) {

    ===================================================== */

    function editItem(item, index) {

        if (!item) {
            return;
        }


        previewes.classList.add(
            "show"
        );


        editIndex = index;


        Title.value =
            item.title || "";


        Link.value =
            item.url || "";


        Formate.value =
            item.type ||
            detectFormat(item.url);


        /*
            Convert date safely to datetime-local.
        */

        try {

            const d =
                new Date(item.date);


            if (!Number.isNaN(d.getTime())) {

                dateInput.value =
                    d.toLocaleString(
                        "sv-SE"
                    )
                    .replace(" ", "T")
                    .slice(0, 16);
            }

        } catch (error) {

            dateInput.value = "";
        }


        preview.src =
            buildEmbed(item.url) ||
            "about:blank";


        thumbURL.value =
            item.thumb || "";


        fileThumb = "";


        thumbFile.value = "";


        if (
            item.thumb &&
            item.thumb.startsWith("data:")
        ) {

            rFile.checked = true;
        }

        else if (
            item.type === "youtube" ||
            item.type === "yt-short"
        ) {

            rYT.checked = true;
        }

        else {

            rURL.checked = true;
        }

    /* =====================================================

    ===================================================== */

    function render() {

        list.innerHTML = "";


        const searchText =
            search.value
                .trim()
                .toLowerCase();


        const filterValue =
            filter.value;


        let data =
            items.map(
                (item, index) => ({
                    ...item,
                    index
                })
            );


        /* =================================================
           SEARCH
        ================================================= */

        if (searchText) {

            data =
                data.filter(item => {

                    const text = (

                        item.title +
                        " " +
                        item.type +
                        " " +
                        item.url

                    ).toLowerCase();


                    return text.includes(
                        searchText
                    );
                });
        }


        /* =================================================
           FILTER
        ================================================= */

        switch (filterValue) {

            case "favorites":

                data =
                    data.filter(
                        item => item.fav
                    );

                break;


            case "url":

            case "youtube":

            case "tiktok":

            case "instagram":

            case "facebook":

            case "twitter":

            case "telegram":

            case "whatsapp":

            case "iframe":

            case "other":

                data =
                    data.filter(
                        item =>
                            item.type ===
                            filterValue
                    );

                break;
        }


        /* =================================================
           SORT
        ================================================= */

        switch (filterValue) {

            case "a → z":

                data.sort(
                    (a, b) =>
                        a.title.localeCompare(
                            b.title
                        )
                );

                break;


            case "z → a":

                data.sort(
                    (a, b) =>
                        b.title.localeCompare(
                            a.title
                        )
                );

                break;


            case "new → old":

                data.sort(
                    (a, b) =>
                        new Date(b.date) -
                        new Date(a.date)
                );

                break;


            case "old → new":

                data.sort(
                    (a, b) =>
                        new Date(a.date) -
                        new Date(b.date)
                );

                break;
        }


        /* =================================================
           COUNT
        ================================================= */

        countBox.textContent =
            data.length;


        /* =================================================
           EMPTY
        ================================================= */

        if (!data.length) {

            const empty =
                fastTag(
                    "div",
                    list,
                    "empty"
                );

            fastTag(
                "h3",
                empty,
                null,
                null,
                "No Data"
            );

            fastTag(
                "p",
                empty,
                null,
                null,
                "No matching items found."
            );

            return;
        }


        /* =================================================
           CARDS
        ================================================= */

        data.forEach(item => {

            const card =
                fastTag(
                    "div",
                    list,
                    "card"
                );


            /* Thumbnail */

            const img =
                fastTag(
                    "img",
                    card,
                    "thumb"
                );


            img.loading = "lazy";


            img.src =
                item.thumb ||
                "https://dummyimage.com/480x270/222/ffffff&text=No+Thumbnail";


            img.onerror = () => {

                img.onerror = null;

                img.src =
                    "https://dummyimage.com/480x270/222/ffffff&text=No+Thumbnail";
            };


            /* Title */

            fastTag(
                "h4",
                card,
                null,
                null,
                item.title
            );


            /* Type */

            fastTag(
                "small",
                card,
                null,
                null,
                String(
                    item.type || "url"
                ).toUpperCase()
            );


            /* Views */

            fastTag(
                "small",
                card,
                null,
                null,
                "Views : " +
                (Number(item.views) || 0)
            );


            /* Date */

            let dateText =
                item.date || "";


            const parsedDate =
                new Date(item.date);


            if (
                item.date &&
                !Number.isNaN(
                    parsedDate.getTime()
                )
            ) {

                dateText =
                    parsedDate.toLocaleString();
            }


            fastTag(
                "small",
                card,
                null,
                null,
                dateText
            );


            /* =================================================
               FAVORITE
            ================================================= */

            const fav =
                fastTag(
                    "button",
                    card,
                    "fav",
                    null,
                    item.fav
                        ? "❤️"
                        : "🤍"
                );


            fav.type = "button";


            fav.title =
                item.fav
                    ? "Remove Favorite"
                    : "Add Favorite";


            fav.onclick = event => {

                event.stopPropagation();


                if (!items[item.index]) {
                    return;
                }


                items[item.index].fav =
                    !items[item.index].fav;


                saveStore();


                render();
            };


            /* =================================================
               EDIT
            ================================================= */

            const edit =
                fastTag(
                    "button",
                    card,
                    "edit",
                    null,
                    "Edit"
                );


            edit.type = "button";


            edit.onclick = event => {

                event.stopPropagation();


                editItem(
                    items[item.index],
                    item.index
                );
            };


            /* =================================================
               OPEN
            ================================================= */

            card.onclick = () => {

                loadMain(
                    items[item.index],
                    item.index
                );
            };

        });
    }


    /* =====================================================
       INITIAL UI STATE
    ===================================================== */

    deleteBtn.style.display = "none";

    updateThumbUI();


    /* =====================================================
       INITIAL RENDER
    ===================================================== */

    render();


    countBox.textContent =
        items.length;


    /* =====================================================
       EXPOSE STORE FOR DEBUGGING
    ===================================================== */

    window.LocalStore = items;


    window.saveLocalStore = () => {

        saveStore();

        window.LocalStore = items;

        return items;
    };


    window.getLocalStore = () => {

        return items;
    };


    window.clearLocalStore = () => {

        const confirmed =
            confirm(
                "Delete all LocalStore data?"
            );


        if (!confirmed) {
            return;
        }


        items = [];

        saveStore();

        window.LocalStore = items;

        render();
    };


    /* =====================================================
       STORAGE EVENT
       Sync if another tab changes LocalStore.
    ===================================================== */

    window.addEventListener(
        "storage",
        event => {

            if (
                event.key !== STORAGE_KEY
            ) {
                return;
            }


            try {

                const newData =
                    JSON.parse(
                        event.newValue || "[]"
                    );


                if (
                    Array.isArray(newData)
                ) {

                    items =
                        newData
                            .map(normalizeItem)
                            .filter(Boolean);


                    window.LocalStore =
                        items;


                    render();
                }

            } catch (error) {

                console.error(
                    "LocalStore synchronization error:",
                    error
                );
            }
        }
    );

});
</script>
</html>
